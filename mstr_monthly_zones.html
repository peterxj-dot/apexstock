<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSTR 月线 LOG — 顶部与底部区域及最优策略标注</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-bg: rgba(88, 166, 255, 0.14);
      --green: #26a69a;
      --red: #ef5350;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .title-badge {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-right: 4px;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .group-label {
      color: var(--muted);
      font-weight: 600;
    }
    input[type="number"] {
      width: 62px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: right;
    }
    .strategy-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      font-size: 12px;
    }
    .toggle-pill input { display: none; }
    .toggle-pill.checked {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }
    .live-cockpit {
      margin: 12px 20px 6px;
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(22, 27, 34, 0.96), rgba(15, 21, 30, 0.98));
      border: 1px solid var(--border);
      border-radius: 10px;
      display: grid;
      grid-template-columns: minmax(290px, 1.05fr) minmax(360px, 1.45fr);
      gap: 16px;
      align-items: stretch;
    }
    @media (max-width: 960px) {
      .live-cockpit {
        grid-template-columns: 1fr;
      }
    }
    .cockpit-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .cockpit-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: var(--text);
    }
    .fresh-pill {
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.16);
      color: #79c0ff;
      border: 1px solid rgba(88, 166, 255, 0.40);
      font-weight: 700;
      font-size: 13px;
    }
    .warn-pill {
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(210, 153, 34, 0.20);
      color: #f0b840;
      border: 1px solid rgba(210, 153, 34, 0.45);
      font-weight: 700;
      font-size: 12.5px;
    }
    .action-box {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      border-left-width: 5px;
      background: rgba(13, 17, 23, 0.78);
    }
    .action-box.tone-buy {
      border-color: #3fb950;
      background: rgba(46, 160, 67, 0.18);
    }
    .action-box.tone-sell {
      border-color: #f85149;
      background: rgba(248, 81, 73, 0.18);
    }
    .action-box.tone-hold {
      border-color: #58a6ff;
      background: rgba(56, 139, 253, 0.16);
    }
    .action-box.tone-wait {
      border-color: #d29922;
      background: rgba(210, 153, 34, 0.13);
    }
    .action-badge {
      font-size: 22px;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 8px;
      white-space: nowrap;
      letter-spacing: 0.4px;
    }
    .tone-buy .action-badge {
      background: #238636;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(63, 185, 80, 0.42);
    }
    .tone-sell .action-badge {
      background: #da3633;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(248, 81, 73, 0.42);
    }
    .tone-hold .action-badge {
      background: #1f6feb;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.35);
    }
    .tone-wait .action-badge {
      background: #9e6a03;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(210, 153, 34, 0.28);
    }
    .action-detail {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .action-pos {
      font-size: 15px;
      font-weight: 700;
      color: #f0f6fc;
    }
    .action-reason {
      font-size: 13.5px;
      color: #c9d1d9;
      line-height: 1.5;
    }
    .cockpit-holding-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13.5px;
      color: #c9d1d9;
    }
    .cockpit-holding-strip b { color: #f0f6fc; }
    .cockpit-radar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 1px solid var(--border);
      padding-left: 16px;
    }
    @media (max-width: 960px) {
      .cockpit-radar {
        border-left: none;
        border-top: 1px solid var(--border);
        padding-left: 0;
        padding-top: 12px;
      }
    }
    .radar-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .radar-groups {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radar-group {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(48, 54, 61, 0.9);
      background: rgba(13, 17, 23, 0.45);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .radar-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #c9d1d9;
    }
    .radar-group-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(139, 148, 158, 0.16);
      color: var(--muted);
      white-space: nowrap;
    }
    .radar-group-tag.ready {
      background: rgba(63, 185, 80, 0.18);
      color: var(--green);
    }
    .radar-group-tag.alert {
      background: rgba(248, 81, 73, 0.18);
      color: var(--red);
    }
    .radar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 8px;
    }
    .radar-item {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(13, 17, 23, 0.72);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .radar-item.ok {
      border-color: rgba(63, 185, 80, 0.45);
      background: rgba(63, 185, 80, 0.08);
    }
    .radar-item.warn {
      border-color: rgba(210, 153, 34, 0.45);
      background: rgba(210, 153, 34, 0.08);
    }
    .radar-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text);
    }
    .radar-flag {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .radar-item.ok .radar-flag { color: var(--green); }
    .radar-item.warn .radar-flag { color: var(--amber); }
    .radar-item.miss .radar-flag { color: var(--muted); }
    .radar-item-val {
      font-size: 11px;
      color: var(--muted);
    }
    #chart {
      width: 100%;
      height: 68vh;
      min-height: 460px;
    }
    .table-wrap {
      padding: 12px 16px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }
    .table-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid #21262d;
      text-align: left;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel);
    }
    .tag-top {
      color: var(--red);
      font-weight: 600;
    }
    .tag-bot {
      color: var(--green);
      font-weight: 600;
    }
    .tag-warn {
      color: #f0b90b;
      font-weight: 600;
    }
  
    .t0-tracker { margin: 12px 24px 0; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px 16px; }
    .t0-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #21262d; }
    .t0-title-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .t0-title { font-size: 14px; font-weight: 700; color: #f0f6fc; }
    .t0-sub { font-size: 11px; color: #8b949e; background: #0d1117; border: 1px solid #30363d; border-radius: 999px; padding: 2px 8px; }
    .t0-stage { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 4px 10px; }
    .t0-stage.muted { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .t0-stage.warn { background: rgba(240,136,62,0.14); color: #f0883e; border: 1px solid rgba(240,136,62,0.4); }
    .t0-stage.active { background: rgba(88,166,255,0.14); color: #58a6ff; border: 1px solid rgba(88,166,255,0.45); }
    .t0-stage.ready { background: rgba(63,185,80,0.16); color: #3fb950; border: 1px solid rgba(63,185,80,0.45); }
    .t0-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #8b949e; margin-top: 8px; }
    .t0-meta b { color: #e6edf3; }
    .t0-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    @media (max-width: 980px) { .t0-cols { grid-template-columns: 1fr; } }
    .t0-card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 11px 12px; }
    .t0-card-h { font-size: 12px; font-weight: 600; color: #c9d1d9; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .t0-item { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #21262d; background: #161b22; }
    .t0-item.ok { border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.08); }
    .t0-item.miss { border-color: #21262d; color: #8b949e; }
    .t0-item-top { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; }
    .t0-item.ok .t0-item-top { color: #3fb950; }
    .t0-item-val { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .t0-tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .t0-tier { padding: 7px 8px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; font-size: 12px; }
    .t0-tier.ok { border-color: rgba(63,185,80,0.45); background: rgba(63,185,80,0.10); }
    .t0-tier-px { font-weight: 700; color: #f0f6fc; font-size: 13px; }
    .t0-tier.ok .t0-tier-px { color: #3fb950; }
    .t0-tier-st { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .t0-note { font-size: 11px; color: #8b949e; margin-top: 8px; line-height: 1.45; }
    .t0-prog-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 999px; height: 10px; overflow: hidden; margin: 6px 0; }
    .t0-prog-bar { height: 100%; background: linear-gradient(90deg, #58a6ff, #3fb950); transition: width 0.25s; }
    .t0-table-wrap { margin-top: 12px; overflow-x: auto; border: 1px solid #21262d; border-radius: 8px; }
    .t0-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #0d1117; }
    .t0-table th, .t0-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #21262d; white-space: nowrap; }
    .t0-table th:first-child, .t0-table td:first-child, .t0-table th:last-child, .t0-table td:last-child { text-align: left; }
    .t0-table th { color: #8b949e; font-weight: 600; background: #161b22; }
    .t0-badge-newlow { color: #ff7b72; font-weight: 600; }
    .t0-badge-hold { color: #3fb950; font-weight: 600; }
    .t0-badge-t0 { color: #58a6ff; font-weight: 700; }
    .t0-hist { margin-top: 8px; font-size: 11px; color: #8b949e; display: flex; flex-wrap: wrap; gap: 14px; }
    .t0-hist b { color: #c9d1d9; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="title-badge">MSTR 比特币减半周期与 mNAV 溢价策略</span>

    <label class="toggle-pill checked" id="logLabel">
      <input type="checkbox" id="logToggle" checked />
      <span>LOG 对数坐标</span>
    </label>

    <label class="toggle-pill checked">
      <input type="checkbox" class="opt-check" id="showZigZag" checked />
      <span>ZigZag 连线</span>
    </label>

    <label class="toggle-pill checked">
      <input type="checkbox" class="opt-check" id="showSma" checked />
      <span>30周 / 200周均线</span>
    </label>

    <label class="toggle-pill checked">
      <input type="checkbox" class="opt-check" id="showFisher" checked />
      <span>月线 Fisher(10)</span>
    </label>

    <label class="toggle-pill">
      <input type="checkbox" class="opt-check" id="showRsi" />
      <span>月线 RSI(14)</span>
    </label>

    <div class="divider"></div>

    <div class="group">
      <span class="group-label">策略标注</span>
      <select id="strategySelect" class="strategy-select">
        <option value="Halv_mNAV_Spike170" selected>MSTR 减半+mNAV放量脉冲: 3战全胜 ($245万, MaxDD -39.7%, Calmar 3.09)</option>
        <option value="BTC_Halv_HV_Combo">MSTR 纯BTC减半+HV共振: 沿用BTC买点区/卖点区 (2战全胜, $83.2万)</option>
        <option value="Halv_Phase_MSTR_GAC">MSTR 减半筑底+高斯通道: 筑底死拿 + MSTR GAC(10,2,1.5) ($45.6万)</option>
        <option value="Halv_MSTR_HV130_Cool90">MSTR 低回撤控险版: MSTR HV20>130%刹车 (MaxDD仅-39.7%)</option>
        <option value="NONE">不显示策略标注</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="group">
      <span class="group-label">上涨确认(%)</span>
      <input type="number" id="upPct" value="120" min="20" max="500" step="10" />
    </div>
    <div class="group">
      <span class="group-label">回撤确认(%)</span>
      <input type="number" id="downPct" value="55" min="15" max="90" step="5" />
    </div>
    <div class="group">
      <span class="group-label">区域容差(±月 / 价格%)</span>
      <input type="number" id="zoneMonths" value="2" min="0" max="5" step="1" />
      <input type="number" id="zoneTolPct" value="20" min="5" max="50" step="5" />
    </div>
  </div>

  <div id="liveCockpit" class="live-cockpit"></div>

  <div id="t0Tracker" class="t0-tracker"></div>

  <div id="chart"></div>

  <div class="table-wrap">
    <div class="table-title" id="summaryTitle">识别到的月线顶部与底部区域</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>类型</th>
          <th>拐点月份</th>
          <th>区域范围</th>
          <th>极值价格 (前复权)</th>
          <th>相对上一拐点涨跌幅</th>
        </tr>
      </thead>
      <tbody id="zoneTableBody"></tbody>
    </table>

    <div id="strategyTableWrap">
      <div class="table-title" id="entryTableTitle" style="margin-top:20px;">策略交易明细</div>
      <table id="entryTable">
        <thead id="entryTableHead"></thead>
        <tbody id="entryTableBody"></tbody>
      </table>
    </div>
  </div>

    function detectZigZag(bars, upTh, downTh) {
      const pivots = [];
      let trend = null;
      let lastHIdx = 0, lastH = bars[0].h;
      let lastLIdx = 0, lastL = bars[0].l;

      for (let i = 1; i < bars.length; i++) {
        const h = bars[i].h;
        const l = bars[i].l;

        if (trend === null) {
          if (h >= lastL * (1 + upTh)) {
            pivots.push({ idx: lastLIdx, type: "L", price: lastL });
            trend = "UP";
            lastHIdx = i;
            lastH = h;
          } else if (l <= lastH * (1 - downTh)) {
            pivots.push({ idx: lastHIdx, type: "H", price: lastH });
            trend = "DOWN";
            lastLIdx = i;
            lastL = l;
          } else {
            if (h > lastH) { lastHIdx = i; lastH = h; }
            if (l < lastL) { lastLIdx = i; lastL = l; }
          }
        } else if (trend === "UP") {
          if (h >= lastH) {
            lastHIdx = i;
            lastH = h;
          } else if (l <= lastH * (1 - downTh)) {
            pivots.push({ idx: lastHIdx, type: "H", price: lastH });
            trend = "DOWN";
            lastLIdx = i;
            lastL = l;
          }
        } else if (trend === "DOWN") {
          if (l <= lastL) {
            lastLIdx = i;
            lastL = l;
          } else if (h >= lastL * (1 + upTh)) {
            pivots.push({ idx: lastLIdx, type: "L", price: lastL });
            trend = "UP";
            lastHIdx = i;
            lastH = h;
          }
        }
      }
      return pivots;
    }

    function expandZones(bars, pivots, maxOffset, tolRatio) {
      return pivots.map((p, k) => {
        let start = p.idx;
        let end = p.idx;
        if (p.type === "H") {
          const minPrice = p.price * (1 - tolRatio);
          for (let i = p.idx - 1; i >= Math.max(0, p.idx - maxOffset); i--) {
            if (bars[i].h >= minPrice || bars[i].c >= minPrice) start = i;
            else break;
          }
          for (let i = p.idx + 1; i <= Math.min(bars.length - 1, p.idx + maxOffset); i++) {
            if (bars[i].h >= minPrice || bars[i].c >= minPrice) end = i;
            else break;
          }
        } else {
          const maxPrice = p.price * (1 + tolRatio);
          for (let i = p.idx - 1; i >= Math.max(0, p.idx - maxOffset); i--) {
            if (bars[i].l <= maxPrice || bars[i].c <= maxPrice) start = i;
            else break;
          }
          for (let i = p.idx + 1; i <= Math.min(bars.length - 1, p.idx + maxOffset); i++) {
            if (bars[i].l <= maxPrice || bars[i].c <= maxPrice) end = i;
            else break;
          }
        }
        const prev = k > 0 ? pivots[k - 1] : null;
        const pctChange = prev ? ((p.price - prev.price) / prev.price) * 100 : null;
        return {
          ...p,
          startIdx: start,
          endIdx: end,
          startMonth: bars[start].m,
          endMonth: bars[end].m,
          pivotMonth: bars[p.idx].m,
          pctChange,
        };
      });
    }

    function calcFisher(highs, lows, period = 10) {
      const n = highs.length;
      const fisher = new Array(n).fill(null);
      const signal = new Array(n).fill(null);
      const med = highs.map((h, i) => (h + lows[i]) / 2);
      let prevX = 0, prevF = 0;
      for (let i = period - 1; i < n; i++) {
        let minV = Infinity, maxV = -Infinity;
        for (let j = i - period + 1; j <= i; j++) {
          if (med[j] < minV) minV = med[j];
          if (med[j] > maxV) maxV = med[j];
        }
        const span = maxV - minV;
        const norm = span === 0 ? 0 : (med[i] - minV) / span - 0.5;
        let x = 0.33 * 2 * norm + 0.67 * prevX;
        if (x > 0.999) x = 0.999;
        if (x < -0.999) x = -0.999;
        const f = 0.5 * Math.log((1 + x) / (1 - x)) + 0.5 * prevF;
        fisher[i] = f;
        signal[i] = prevF;
        prevX = x;
        prevF = f;
      }
      return { fisher, signal };
    }

    function calcRSI(arr, period = 14) {
      const out = new Array(arr.length).fill(null);
      const alpha = 1 / period;
      let avgGain = 0, avgLoss = 0;
      for (let i = 1; i < arr.length; i++) {
        const delta = arr[i] - arr[i - 1];
        const gain = delta > 0 ? delta : 0;
        const loss = delta < 0 ? -delta : 0;
        if (i === 1) { avgGain = gain; avgLoss = loss; }
        else {
          avgGain = alpha * gain + (1 - alpha) * avgGain;
          avgLoss = alpha * loss + (1 - alpha) * avgLoss;
        }
        if (i >= period) {
          out[i] = avgLoss === 0 ? (avgGain > 0 ? 100 : 50) : 100 - 100 / (1 + avgGain / avgLoss);
        }
      }
      return out;
    }

    function fmtWan(val) {
      if (val >= 100000000) return `$${(val / 100000000).toFixed(2)}亿`;
      if (val >= 10000) return `$${(val / 10000).toFixed(1)}万`;
      return `$${val.toFixed(2)}`;
    }

      const stratId = document.getElementById("strategySelect").value;

      const upTh = Math.max(0.1, Number(document.getElementById("upPct").value) / 100);
      const downTh = Math.min(0.95, Math.max(0.1, Number(document.getElementById("downPct").value) / 100));
      const zoneMonths = Math.max(0, Number(document.getElementById("zoneMonths").value));
      const zoneTol = Math.max(0.01, Number(document.getElementById("zoneTolPct").value) / 100);

      const dates = MONTHLY.map(b => b.m);
      const opens = MONTHLY.map(b => b.o);
      const highs = MONTHLY.map(b => b.h);
      const lows = MONTHLY.map(b => b.l);
      const closes = MONTHLY.map(b => b.c);

      const pivots = detectZigZag(MONTHLY, upTh, downTh);
      const zones = expandZones(MONTHLY, pivots, zoneMonths, zoneTol);

      const subPanels = [];
      if (showFisher) subPanels.push("fisher");
      if (showRsi) subPanels.push("rsi");
      const subH = subPanels.length === 0 ? 0 : Math.min(0.20, 0.38 / subPanels.length);
      const gap = 0.04;
      const mainBottom = subPanels.length * (subH + gap);

      const traces = [];
      const shapes = [];
      const annotations = [];

      zones.forEach(z => {
        const isTop = z.type === "H";
        shapes.push({
          type: "rect",
          xref: "x",
          x0: z.startIdx - 0.45,
          x1: z.endIdx + 0.45,
          yref: "paper",
          y0: mainBottom,
          y1: 1,
          fillcolor: isTop ? "rgba(239, 83, 80, 0.16)" : "rgba(38, 166, 154, 0.16)",
          line: {
            color: isTop ? "rgba(239, 83, 80, 0.45)" : "rgba(38, 166, 154, 0.45)",
            width: 1,
          },
          layer: "below",
        });

        annotations.push({
          xref: "x",
          x: z.pivotMonth,
          yref: "y",
          y: isLog ? Math.log10(z.price) : z.price,
          text: isTop ? `▼ 顶 ${z.price.toFixed(2)}` : `▲ 底 ${z.price.toFixed(2)}`,
          showarrow: true,
          arrowhead: 0,
          arrowcolor: isTop ? "#ef5350" : "#26a69a",
          ax: 0,
          ay: isTop ? -22 : 22,
          font: { color: isTop ? "#ff7b72" : "#3fb950", size: 10, weight: 700 },
          bgcolor: "rgba(13,17,23,0.75)",
        });
      });

      traces.push({
        type: "candlestick",
        name: "MSTR 月线",
        x: dates,
        open: opens,
        high: highs,
        low: lows,
        close: closes,
        increasing: { line: { color: "#26a69a" }, fillcolor: "#26a69a" },
        decreasing: { line: { color: "#ef5350" }, fillcolor: "#ef5350" },
        yaxis: "y",
      });

      if (showZigZag && zones.length > 0) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          name: "ZigZag 拐点",
          x: zones.map(z => z.pivotMonth),
          y: zones.map(z => z.price),
          line: { width: 1.5, color: "#f0b90b", dash: "dot" },
          marker: { size: 7, color: zones.map(z => (z.type === "H" ? "#ef5350" : "#26a69a")) },
          yaxis: "y",
        });
      }

      if (showSma) {
        const smaMap = new Map(WEEKLY_SMA.map(w => [w.m, w]));
        traces.push({
          type: "scatter",
          mode: "lines",
          name: "30周均线",
          x: dates,
          y: dates.map(d => (smaMap.get(d) ? smaMap.get(d).s30 : null)),
          line: { width: 1.4, color: "#58a6ff" },
          yaxis: "y",
        });
        traces.push({
          type: "scatter",
          mode: "lines",
          name: "200周均线",
          x: dates,
          y: dates.map(d => (smaMap.get(d) ? smaMap.get(d).s200 : null)),
          line: { width: 1.5, color: "#d2a8ff" },
          yaxis: "y",
        });
      }

      addStrategyTraces(traces, stratId);

      const layout = {
        paper_bgcolor: "#0d1117",
        plot_bgcolor: "#0d1117",
        font: { color: "#e6edf3", size: 11 },
        margin: { l: 64, r: 24, t: 36, b: 36 },
        hovermode: "x unified",
        showlegend: true,
        legend: { orientation: "h", x: 0, y: 1.04, bgcolor: "rgba(0,0,0,0)" },
        xaxis: {
          type: "category",
          rangeslider: { visible: false },
          gridcolor: "#21262d",
          nticks: 16,
        },
        yaxis: {
          domain: [mainBottom, 1],
          type: isLog ? "log" : "linear",
          gridcolor: "#21262d",
          title: isLog ? "MSTR 价格 (LOG)" : "MSTR 价格",
          autorange: true,
        },
        shapes,
        annotations,
      };

      subPanels.forEach((panel, idx) => {
        const axisNum = idx + 2;
        const yName = `yaxis${axisNum}`;
        const yRef = `y${axisNum}`;
        const top = mainBottom - gap - idx * (subH + gap);
        const bottom = Math.max(0, top - subH);

        if (panel === "fisher") {
          layout[yName] = { domain: [bottom, top], gridcolor: "#21262d", title: "月线 Fisher" };
          const f = calcFisher(highs, lows, 10);
          traces.push({
            type: "scatter", mode: "lines", name: "Fisher(10)",
            x: dates, y: f.fisher, line: { width: 1.4, color: "#2dd4bf" }, yaxis: yRef,
          });
          traces.push({
            type: "scatter", mode: "lines", name: "Fisher Signal",
            x: dates, y: f.signal, line: { width: 1.2, color: "#f97316", dash: "dot" }, yaxis: yRef,
          });
          layout.shapes.push(
            { type: "line", xref: "paper", x0: 0, x1: 1, yref: yRef, y0: 0, y1: 0, line: { color: "#484f58", width: 1, dash: "dash" } }
          );
        } else if (panel === "rsi") {
          layout[yName] = { domain: [bottom, top], gridcolor: "#21262d", title: "月线 RSI(14)", range: [0, 100] };
          traces.push({
            type: "scatter", mode: "lines", name: "RSI(14)",
            x: dates, y: calcRSI(closes, 14), line: { width: 1.4, color: "#c084fc" }, yaxis: yRef,
          });
          layout.shapes.push(
            { type: "line", xref: "paper", x0: 0, x1: 1, yref: yRef, y0: 70, y1: 70, line: { color: "#ef5350", width: 1, dash: "dot" } },
            { type: "line", xref: "paper", x0: 0, x1: 1, yref: yRef, y0: 30, y1: 30, line: { color: "#26a69a", width: 1, dash: "dot" } }
          );
        }
      });

      Plotly.newPlot("chart", traces, layout, { responsive: true, scrollZoom: true });

      const tbody = document.getElementById("zoneTableBody");
      tbody.innerHTML = zones.map((z, i) => {
        const isTop = z.type === "H";
        const cls = isTop ? "tag-top" : "tag-bot";
        const label = isTop ? "顶部区域" : "底部区域";
        const pct = z.pctChange === null
          ? "—"
          : `${z.pctChange >= 0 ? "+" : ""}${z.pctChange.toFixed(1)}%`;
        return `<tr>
          <td>${i + 1}</td>
          <td class="${cls}">${label}</td>
          <td>${z.pivotMonth}</td>
          <td>${z.startMonth} ~ ${z.endMonth}</td>
          <td>${z.price.toFixed(2)}</td>
          <td class="${cls}">${pct}</td>
        </tr>`;
      }).join("");

      let stratInfo = "";
      if (stratId === "C7_Vol") {
        stratInfo = ` ｜ 大底入口 C7_Vol（共 ${C7_ENTRIES.length} 次触发，6月/12月胜率 100%）`;
      } else if (stratId !== "NONE" && STRATEGIES[stratId]) {
        const st = STRATEGIES[stratId].stats;
        stratInfo = ` ｜ ${STRATEGIES[stratId].short_label}（$1万→${fmtWan(st.final)}, CAGR ${st.cagr.toFixed(2)}%, MaxDD ${st.max_dd.toFixed(2)}%, ${st.trades}笔, 胜率 ${st.win_rate.toFixed(1)}%）`;
      }
      document.getElementById("summaryTitle").textContent =
        `共识别 ${zones.length} 个月线顶底区域（上涨 ≥ ${(upTh * 100).toFixed(0)}% / 回撤 ≥ ${(downTh * 100).toFixed(0)}%）${stratInfo}`;

      renderStrategyTable(stratId);
      renderLiveCockpit(stratId);
    }

    function fmtV(val, suffix = "", digits = 2) {
      if (val === null || val === undefined || Number.isNaN(val)) return "—";
      return `${Number(val).toFixed(digits)}${suffix}`;
    }

    function radarCell(title, ok, valueText, warn = false) {
      const cls = ok ? "ok" : (warn ? "warn" : "miss");
      const flag = ok ? "✓ 满足" : (warn ? "! 接近" : "○ 未满足");
      return {
        ok: Boolean(ok),
        html: `<div class="radar-item ${cls}">
          <div class="radar-item-head"><span>${title}</span><span class="radar-flag">${flag}</span></div>
          <div class="radar-item-val">${valueText}</div>
        </div>`,
      };
    }

    function renderRadarGroup(title, cells, mode = "all") {
      const done = cells.filter(c => c.ok).length;
      const total = cells.length;
      let tagText = `已满足 ${done}/${total}`;
      let tagCls = "";
      if (mode === "all") {
        if (done === total && total > 0) tagCls = "ready";
      } else if (mode === "any_exit") {
        tagText = done > 0 ? `已触发 ${done} 项` : `未触发 (0/${total})`;
        if (done > 0) tagCls = "alert";
      } else if (mode === "any_entry") {
        tagText = done > 0 ? `已触发 ${done} 项` : `未触发 (0/${total})`;
        if (done > 0) tagCls = "ready";
      }
      return `<div class="radar-group">
        <div class="radar-group-head">
          <span>${title}</span>
          <span class="radar-group-tag ${tagCls}">${tagText}</span>
        </div>
        <div class="radar-grid">${cells.map(c => c.html).join("")}</div>
      </div>`;
    }

        box.style.display = "none";
        return;
      }

            <span>成本均价: <b>$${ls.entry_px.toFixed(2)}</b></span>

            ${ls.hold_weeks !== null ? `<span>已持仓: <b>${ls.hold_weeks} 周</b></span>` : ""}
            ${ls.sl_price !== null ? `<span>假底止损线: <b>$${ls.sl_price.toFixed(2)}</b></span>` : ""}
            ${ls.wtsl_price !== null ? `<span>周回撤35%线: <b>$${ls.wtsl_price.toFixed(2)}</b></span>` : ""}

            </div>
          </div>
        `;
      }

      const groups = [];
      if (ls && ls.pos_mode !== "FLAT") {
        const g1 = [
          radarCell("mNAV溢价脉冲 MSTR/BTC ≥ 1.70x", ml.mstr_btc_r60 >= 1.70, `当前相对60日均 ${fmtV(ml.mstr_btc_r60)}x`),
          radarCell("放量确认 近3日最大量比 ≥ 1.5x", ml.mstr_vol_r3 >= 1.50, `近3日最高 ${fmtV(ml.mstr_vol_r3)}x (今日 ${fmtV(ml.mstr_vol_r20)}x)`),
          radarCell("处于BTC卖点区 [H+480~+560]", Boolean(ml.in_sell_zone), `距上次减半 +${ml.ds} 天`),
          radarCell("BTC波动率脉冲 HVR ≥ 1.30", ml.btc_hvr >= 1.30, `当前 BTC HVR=${fmtV(ml.btc_hvr)}`),
        ];
        const g2 = [
          radarCell("MSTR 20日年化波动率", ml.mstr_hv20 > 130, `当前 HV20=${fmtV(ml.mstr_hv20, "%", 1)} (低回撤刹车线 130%)`),
          radarCell("MSTR GAC(10,2,1.5) 中轨", m.soxl_close > ml.gac_mid, `MSTR $${fmtV(m.soxl_close)} vs 中轨 $${fmtV(ml.gac_mid)}`),
        ];
        groups.push(renderRadarGroup("卖出监控 · mNAV溢价脉冲 & BTC卖点区", g1, "any_exit"));
        groups.push(renderRadarGroup("风控参考 · MSTR波动率与高斯通道", g2, "all"));
      } else {

          radarCell("BTC近35日恐慌脉冲 HVR≥1.30", Boolean(ml.btc_hvr_spike35), `当前 BTC HVR=${fmtV(ml.btc_hvr)}`),
          radarCell("BTC脉冲冷却 HVR < 1.0", ml.btc_hvr < 1.0, `当前 BTC HV20/HV60 = ${fmtV(ml.btc_hvr)}`),
        ];
        const canReenterWindow = ml.ds < 200 || ml.du <= 100;
        const g2 = [
          radarCell("买点区时间兜底 H ≤ -490天", ml.du <= 490, `当前 -${ml.du} 天 (还差 ${Math.max(0, ml.du - 490)} 天)`),
          radarCell("逃顶后锁盈过滤 (仅H+200前接回)", canReenterWindow, `当前 H+${ml.ds}d / -${ml.du}d (H+200后锁盈过滤亏损单)`),
          radarCell("mNAV冷却接回 (≤1.10x 且 >GAC中轨)", canReenterWindow && ml.mstr_btc_r60 <= 1.10 && m.soxl_close > ml.gac_mid, `R60=${fmtV(ml.mstr_btc_r60)}x | $${fmtV(m.soxl_close)} vs GAC $${fmtV(ml.gac_mid)}`),
        ];
        groups.push(renderRadarGroup("买点区主规则 · BTC减半窗口脉冲冷却（满足全部 → 买入）", g1, "all"));

      }

      box.innerHTML = `
        <div class="cockpit-main">
          <div class="cockpit-meta">${freshHtml}</div>
          ${actionHtml}
          ${holdingHtml}
        </div>
        <div class="cockpit-radar">
          <div class="radar-title">
            <span>${ls && ls.pos_mode !== "FLAT" ? "出口条件雷达 · 持仓退出监控" : "入口条件雷达 · 分组规则监控"}</span>
            <span>周线基准: ${m.w_date}</span>
          </div>
          <div class="radar-groups">${groups.join("")}</div>
        </div>
      `;
    }

    document.getElementById("logToggle").addEventListener("change", e => {
      document.getElementById("logLabel").classList.toggle("checked", e.target.checked);
      render();
    });
    document.querySelectorAll(".opt-check").forEach(el => {
      el.addEventListener("change", () => {
        el.parentElement.classList.toggle("checked", el.checked);
        render();
      });

    document.getElementById("strategySelect").addEventListener("change", render);
    ["upPct", "downPct", "zoneMonths", "zoneTolPct"].forEach(id => {

              <div class="t0-tier-st">${x.filled ? `✓ ${x.fill_date.slice(5)} @ $${fmtV(x.fill_px)}` : "○ 待接针限价"}</div>

          : "待进窗确认锚点";
        col2Body = `<div class="t0-item miss">
          <div class="t0-item-top"><span>限价网暂未激活（等 T0 亮灯）</span><span>○ 锁定</span></div>
          <div class="t0-item-val">参考锚点下方 92/86/80/74%：${preview}</div>
        </div>`;
      }

      const col2 = `
        <div class="t0-card">
          <div class="t0-card-h">

          </div>
          ${col2Body}
          <div class="t0-note">历史 11 次 MSTR 恐慌中 9 次 (82%) 于 T0 后 1–10 交易日内打出针尖；限价总仓封顶 50%，其余留给右侧兜底。</div>

        ? `✓ 首次连续5日守稳触发：${t.first_5d_date}${t.first_5d_px !== null ? ` @ $${fmtV(t.first_5d_px)}` : ""}`
        : (t.t0_triggered

          : "T0 亮灯后自动开启 5 日不破新低计数");

      const col3 = `

          <div class="t0-card-h">

          </div>
          <div class="t0-item ${t.first_5d_date ? "ok" : "miss"}">
            <div class="t0-item-top">
              <span>连续 5 个交易日不破前低</span>
              <span>${streak}/5</span>
            </div>
            <div class="t0-prog-wrap"><div class="t0-prog-bar" style="width:${pct}%"></div></div>
            <div class="t0-item-val">${rightStatus}</div>
          </div>
          <div class="t0-item ${(ml.btc_hvr < 1.0 && ml.btc_hvr_spike35) || t.du <= 490 ? "ok" : "miss"}">
            <div class="t0-item-top">
              <span>原策略兜底：BTC HVR < 1.0 或 H-490 (${t.h490_date})</span>
              <span>H-${t.du}d</span>
            </div>
            <div class="t0-item-val">窗内最低: ${t.win_low !== null ? `$${fmtV(t.win_low)} (${t.win_low_date}, 距T0 ${fmtV(t.drop_from_t0_pct, "%", 1)})` : "—"} | BTC HVR=${fmtV(ml.btc_hvr)}</div>
          </div>
          <div class="t0-note">创新低计数自动归零；若为 11–12 月行情，须防范 12 月下旬税损抛售“二次插针”。</div>
        </div>`;

      let tableHtml = "";
      if (t.daily_rows && t.daily_rows.length > 0) {
        tableHtml = `
          <div class="t0-table-wrap">
            <table class="t0-table">
              <thead>
                <tr>
                  <th>日期</th><th>Open</th><th>Low</th><th>Close</th><th>距T0收盘</th><th>r60</th><th>BTC HVR</th><th>量比</th><th>右侧状态</th>
                </tr>
              </thead>
              <tbody>
                ${t.daily_rows.map(r => {
                  const st = r.is_t0
                    ? `<span class="t0-badge-t0">● T0 亮灯日</span>`
                    : (r.is_new_low
                      ? `<span class="t0-badge-newlow">★ 破前低 (重置 0/5)</span>`
                      : `<span class="t0-badge-hold">守住前低 (${r.streak}/5)</span>`);
                  return `<tr>
                    <td>${r.date}</td>
                    <td>$${fmtV(r.open)}</td>
                    <td>$${fmtV(r.low)}</td>
                    <td>$${fmtV(r.close)}</td>
                    <td>${r.vs_t0_pct !== null ? `${r.vs_t0_pct >= 0 ? "+" : ""}${fmtV(r.vs_t0_pct, "%", 1)}` : "—"}</td>
                    <td>${fmtV(r.r60, "x")}</td>
                    <td>${fmtV(r.b_hvr)}</td>
                    <td>${fmtV(r.vol_r20, "x")}</td>
                    <td>${st}</td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }

      const histHtml = (t.history_windows && t.history_windows.length > 0)
        ? `<div class="t0-hist"><span>买点窗历史对照：</span>${t.history_windows.map(h =>
            `<span><b>${h.cycle}</b>: 锚 $${fmtV(h.pre_low)} → T0 ${h.t0_date} ($${fmtV(h.t0_close)}) → 窗内低 $${fmtV(h.win_low)} (${h.win_low_date}, +${h.days_to_low}交易日, ${fmtV(h.drop_from_t0_pct, "%", 1)})</span>`
          ).join("")}</div>`
        : "";

      el.innerHTML = `
        <div class="t0-head">
          <div class="t0-title-wrap">
            <span class="t0-title">MSTR T0 恐慌洗盘与接货追踪器</span>
            <span class="t0-sub">独立追踪 · 不改动上方原有策略买卖信号</span>
          </div>
          <span class="t0-stage ${t.stage_tone}">${t.stage_label}</span>
        </div>
        <div class="t0-meta">
          <span>当前买点窗: <b>${t.win_start} ~ ${t.win_end}</b> (${t.in_buy_zone ? "窗内" : "窗外"} · H-${t.du}d)</span>
          <span>窗前锚点低点: <b>${t.pre_low !== null ? `$${fmtV(t.pre_low)} (${t.pre_low_date})` : "—"}</b></span>
          <span>T0 基准: <b>${t.t0_triggered ? `${t.t0_date} 收 $${fmtV(t.t0_close)}` : "尚未触发"}</b></span>
          <span>窗内最低: <b>${t.win_low !== null ? `$${fmtV(t.win_low)} (${t.win_low_date}${t.vs_pre_low_pct !== null ? `, 较前低 ${fmtV(t.vs_pre_low_pct, "%", 1)}` : ""})` : "—"}</b></span>
        </div>
        <div class="t0-cols">${col1}${col2}${col3}</div>
        ${tableHtml}
        ${histHtml}
      `;
    }

    render();
    renderT0Tracker();
  </script>
</body>
</html>
